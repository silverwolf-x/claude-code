name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version (leave empty for the latest Claude Code release)'
        required: false
        type: string
      force:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read   # the win32 build polls the native job's status

# Release builds cover these targets only.
env:
  PLATFORMS: linux-x64,win32-x64

jobs:
  # Resolves the one version this run builds. Needs nothing from the repo:
  # the runner's preinstalled node/npm and gh are enough.
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
    steps:
      - name: Resolve version
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(npm view @anthropic-ai/claude-code version)
            if [ -z "$VERSION" ]; then
              echo "::error::Could not resolve the latest @anthropic-ai/claude-code version"
              exit 1
            fi
            echo "Latest: ${VERSION}"
          else
            echo "Manual: ${VERSION}"
          fi
          if [ "$FORCE" != "true" ] && \
             gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "::notice::v${VERSION} is already released; nothing to do (tick force to rebuild)"
            exit 0
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # cometix-native (native/): the Bun.ant members the polyfill attaches.
  # Only win32-x64 ships here, so only x64 is built, and the result is cached
  # on the native sources: a run that did not touch native/ restores it
  # instead of compiling. It is still checked against the OS every time.
  # Off the critical path: the win32 build only picks it up once patching is
  # done, so compiling overlaps the download and patch.
  native:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore build
        id: cache
        uses: actions/cache@v6
        with:
          path: native/dist/
          key: cometix-native-x64-${{ hashFiles('native/src/**', 'native/Cargo.toml', 'native/Cargo.lock', 'native/build.rs', 'native/build.sh') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          NATIVE_ARCHES: x64
        run: bash native/build.sh

      - name: Check against the OS
        run: node native/check.cjs

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: cometix-native
          path: native/dist/

  # The same suite as test.yml. It runs beside the build rather than ahead of
  # it; nothing is released past a failure.
  test:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            patcher/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm ci --prefix patcher --ignore-scripts --no-audit --no-fund
      - run: npm test

  # One job per platform: extraction and patching run one platform per
  # process, so splitting them across runners halves the build. Neither waits
  # for the native job up front; see "Add cometix-native".
  build:
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, win32-x64]
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Build package
        run: |
          node scripts/fetch-and-process.mjs \
            --version "$VERSION" \
            --platforms "${{ matrix.platform }}" \
            --output "./dist/$VERSION"

      # build-platform-package would copy the addon to the platform package
      # root; doing it here instead lets patching run while it compiles.
      - name: Wait for cometix-native
        if: startsWith(matrix.platform, 'win32-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 180); do
            S=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs" \
              --jq '.jobs[] | select(.name == "native") | "\(.status) \(.conclusion // "")"')
            case "$S" in
              "completed success") exit 0 ;;
              completed*) echo "::error::native job ended: $S"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::timed out waiting for the native job"; exit 1

      - name: Add cometix-native
        if: startsWith(matrix.platform, 'win32-')
        uses: actions/download-artifact@v8
        with:
          name: cometix-native
          path: dist/${{ needs.check.outputs.version }}/packages/${{ matrix.platform }}/

      # One self-contained tarball: main package and platform package merged,
      # installable with `npm install -g <file>.tgz` without any @cometix
      # package on the registry.
      - name: Package release tarball
        run: |
          PLATFORM="${{ matrix.platform }}"
          STAGE="$RUNNER_TEMP/pkg-wrap-${PLATFORM}"
          mkdir -p ./artifacts
          node scripts/build-standalone-package.mjs \
            --dist "./dist/$VERSION" --platform "$PLATFORM" --output "$STAGE/package"
          GZ=$(command -v pigz || command -v gzip)
          tar -C "$STAGE" -cf - package/ | "$GZ" -1 \
            > "./artifacts/cometix-claude-code-${VERSION}-${PLATFORM}.tgz"
          ls -lh ./artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/
          compression-level: 0

  # Install each tarball the way a user would, on its own OS, and run it from
  # outside the package directory to catch assets resolved against cwd.
  verify:
    needs: [check, build]
    if: needs.check.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-x64, win32-x64]
    runs-on: ${{ matrix.platform == 'win32-x64' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      # Defender scans every file npm extracts; with the bundle's ~1500
      # files that is most of a Windows install.
      - name: Stop Defender real-time scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: package-${{ matrix.platform }}
          path: artifacts/

      - name: Install
        run: |
          TGZ="./artifacts/cometix-claude-code-${{ needs.check.outputs.version }}-${{ matrix.platform }}.tgz"
          npm install -g "$TGZ" --no-audit --no-fund

      - name: Run
        run: |
          cd "$RUNNER_TEMP"
          claude --version
          claude --help > help.txt
          head -5 help.txt
          claude mcp list

  release:
    needs: [check, native, test, verify]
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: package-*
          merge-multiple: true
          path: artifacts/

      - name: Sync CHANGELOG
        run: |
          curl -sL "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md" \
            -o CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || (git commit -m "changelog: sync v${VERSION} [skip ci]" && git push)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            if [ "${{ inputs.force }}" = "true" ]; then
              gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            else
              echo "Release v${VERSION} already exists, skipping"
              exit 0
            fi
          fi

          BODY=$(gh api "repos/anthropics/claude-code/releases/tags/v${VERSION}" --jq '.body' 2>/dev/null || echo "")
          NOTES=$(printf '%s\n\n%s\n\n%s' \
            "Install (Node.js 24+): \`npm install -g ./cometix-claude-code-${VERSION}-<platform>.tgz\`" \
            "Platforms: ${PLATFORMS//,/, }." \
            "$BODY")

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            artifacts/*
