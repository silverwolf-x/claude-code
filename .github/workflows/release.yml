name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Specific version (leave empty for auto-detect)'
        required: false
        type: string
      force:
        description: 'Force rebuild even if release exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Release builds cover these targets only.
env:
  PLATFORMS: linux-x64,win32-x64

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.detect.outputs.versions }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
      - run: npm ci

      - name: Detect new versions
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "versions=[\"${{ inputs.version }}\"]" >> "$GITHUB_OUTPUT"
            echo "Manual: ${{ inputs.version }}"
          else
            EXISTING=$(gh release list --limit 200 --json tagName \
              --jq '[.[].tagName | ltrimstr("v")]' 2>/dev/null || echo '[]')
            VERSIONS=$(node scripts/check-new-versions.mjs \
              --existing "$EXISTING" --json)
            echo "versions=$VERSIONS" >> "$GITHUB_OUTPUT"
          fi

  # cometix-native (native/): the Bun.ant members the polyfill attaches.
  # Built once per run, on Windows — the only platform whose members it
  # implements so far — and checked against the OS there before any package
  # takes it. A missing arm64 build is a warning, not a failure: the polyfill
  # leaves the members absent and the bundle falls back as it always has.
  native:
    needs: check
    if: needs.check.outputs.versions != '[]' && needs.check.outputs.versions != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'

      - name: Build
        shell: bash
        run: bash native/build.sh

      - name: Check against the OS
        run: node native/check.cjs

      - name: Upload
        uses: actions/upload-artifact@v6
        with:
          name: cometix-native
          path: native/dist/

  build:
    needs: [check, native]
    if: needs.check.outputs.versions != '[]' && needs.check.outputs.versions != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.check.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
      - run: npm ci

      - name: Download cometix-native
        uses: actions/download-artifact@v6
        with:
          name: cometix-native
          path: native/dist/

      - name: Build packages
        run: |
          node scripts/fetch-and-process.mjs \
            --version "${{ matrix.version }}" \
            --platforms "$PLATFORMS" \
            --output "./dist/${{ matrix.version }}"

      # One self-contained tarball per platform: main package and platform
      # package merged, installable with `npm install -g <file>.tgz` without
      # any @cometix package on the registry.
      - name: Package release tarballs
        run: |
          DIST="./dist/${{ matrix.version }}"
          VERSION="${{ matrix.version }}"
          mkdir -p ./artifacts
          for platform in ${PLATFORMS//,/ }; do
            STAGE="/tmp/pkg-wrap-${platform}"
            node scripts/build-standalone-package.mjs \
              --dist "$DIST" --platform "$platform" --output "$STAGE/package"
            tar czf "./artifacts/cometix-claude-code-${VERSION}-${platform}.tgz" -C "$STAGE" package/
            rm -rf "$STAGE"
          done
          ls -lh ./artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.version }}
          path: artifacts/

  # Install each tarball the way a user would, on its own OS, and run it from
  # outside the package directory to catch assets resolved against cwd.
  verify:
    needs: [check, build]
    if: needs.check.outputs.versions != '[]' && needs.check.outputs.versions != ''
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.check.outputs.versions) }}
        platform: [linux-x64, win32-x64]
    runs-on: ${{ matrix.platform == 'win32-x64' && 'windows-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: packages-${{ matrix.version }}
          path: artifacts/

      - name: Install
        run: |
          TGZ="artifacts/cometix-claude-code-${{ matrix.version }}-${{ matrix.platform }}.tgz"
          npm install -g "$TGZ" --no-audit --no-fund

      - name: Run
        run: |
          cd "$RUNNER_TEMP"
          claude --version
          claude --help > help.txt
          head -5 help.txt
          claude mcp list

  release:
    needs: [check, verify]
    if: needs.check.outputs.versions != '[]' && needs.check.outputs.versions != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.check.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: packages-${{ matrix.version }}
          path: artifacts/

      - name: Sync CHANGELOG
        run: |
          curl -sL "https://raw.githubusercontent.com/anthropics/claude-code/main/CHANGELOG.md" \
            -o CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || (git commit -m "changelog: sync v${{ matrix.version }}" && git push)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ matrix.version }}"

          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            if [ "${{ inputs.force }}" = "true" ]; then
              gh release delete "v${VERSION}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            else
              echo "Release v${VERSION} already exists, skipping"
              exit 0
            fi
          fi

          BODY=$(gh api "repos/anthropics/claude-code/releases/tags/v${VERSION}" --jq '.body' 2>/dev/null || echo "")
          NOTES=$(printf '%s\n\n%s\n\n%s' \
            "Install (Node.js 24+): \`npm install -g ./cometix-claude-code-${VERSION}-<platform>.tgz\`" \
            "Platforms: ${PLATFORMS//,/, }." \
            "$BODY")

          gh release create "v${VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v${VERSION}" \
            --notes "$NOTES" \
            artifacts/*
