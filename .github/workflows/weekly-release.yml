name: Weekly release

# Every Monday: bring master up to upstream, rebase release (every change of
# this fork) onto it, then build on release.
#
# GitHub only runs schedules from the default branch, which is release.
# master stays a pure mirror of upstream: it is only ever fast-forwarded, so a
# commit of our own on it makes the sync fail instead of being thrown away.
#
# Pushing needs SYNC_TOKEN, a token that may write workflow files: the rebased
# release carries commits that touch .github/workflows, and GITHUB_TOKEN is not
# allowed to push those.
on:
  schedule:
    - cron: '0 20 * * 0'   # Monday 04:00 UTC+8
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-release
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/CometixSpace/claude-code.git

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      upstream_moved: ${{ steps.master.outputs.moved }}
    steps:
      - name: Require SYNC_TOKEN
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Set the SYNC_TOKEN secret (a token with contents and workflows write) so the sync can push"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: release
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fast-forward master to upstream
        id: master
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch --no-tags upstream master
          git fetch --no-tags origin master
          OLD=$(git rev-parse origin/master)
          NEW=$(git rev-parse upstream/master)
          if [ "$OLD" = "$NEW" ]; then
            echo "master is already at upstream ($NEW)"
            echo "moved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$OLD" "$NEW"; then
            echo "::error::master has commits upstream does not; it must stay a pure mirror. Move them to release first."
            exit 1
          fi
          git push origin "$NEW:refs/heads/master"
          echo "master: ${OLD:0:7} -> ${NEW:0:7}"
          echo "moved=true" >> "$GITHUB_OUTPUT"

      # Our CHANGELOG syncs and upstream's both copy Anthropic's CHANGELOG, so a
      # conflict there is settled with upstream's copy (the Release run syncs
      # it again). A conflict anywhere else stops the run for a person to fix.
      - name: Rebase release onto master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BEFORE=$(git rev-parse HEAD)
          git rebase upstream/master || true
          while [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; do
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            if [ "$CONFLICTS" != "CHANGELOG.md" ]; then
              echo "::error::Rebase of release onto upstream stopped on: ${CONFLICTS:-unknown}"
              git rebase --abort
              exit 1
            fi
            git checkout --ours -- CHANGELOG.md
            git add CHANGELOG.md
            if git diff --cached --quiet; then
              git rebase --skip || true
            else
              GIT_EDITOR=true git rebase --continue || true
            fi
          done
          if [ "$(git rev-parse HEAD)" = "$BEFORE" ]; then
            echo "release is already on top of upstream"
          else
            git push --force-with-lease="release:$BEFORE" origin HEAD:release
            echo "release rebased: ${BEFORE:0:7} -> $(git rev-parse --short HEAD)"
          fi

  build:
    needs: sync
    runs-on: ubuntu-latest
    steps:
      # New upstream commits mean new patches or fixes, so the current version
      # is rebuilt (force); otherwise Release builds only a new Claude Code.
      - name: Trigger Release on release
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ needs.sync.outputs.upstream_moved }}
        run: |
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref release -f force="${FORCE:-false}"
